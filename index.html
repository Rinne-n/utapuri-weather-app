<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UTAPURI Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;700&family=Cormorant+Garamond:ital,wght@1,600&display=swap">
<style>
/* Layout: phone app — weather bar on top, one screen at a time (home / card / book / talk), tab bar fixed at the bottom */
:root{
  --sky:#ffe9f4; --sky2:#e6f0ff; --ink:#3a2350; --ink-soft:#7a5f8e;
  --pink:#ff4fa3; --pink-deep:#d8287f; --gold:#ffc85a; --mint:#3fd6c0; --rain:#5b8cff; --night:#140a26;
  --card:#ffffff; --line:rgba(58,35,80,.12);
  --display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --serif:"Cormorant Garamond","Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--body);color:var(--ink);font-size:14px;
  background:radial-gradient(120% 60% at 50% 0%,var(--sky2) 0%,transparent 60%),radial-gradient(80% 50% at 100% 100%,#fff3d6 0%,transparent 60%),var(--sky)}
button{font:inherit;color:inherit}
.app{max-width:440px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 86px);display:flex;flex-direction:column;gap:12px}

/* weather bar */
.wx{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;background:rgba(255,255,255,.88);
  border:2px solid #fff;border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 rgba(216,40,127,.14)}
.wx svg{width:40px;height:40px}
.wx b{font-family:var(--display);font-weight:800;font-size:16px;display:block;line-height:1.25}
.wx span{font-size:12px;color:var(--ink-soft);display:block;line-height:1.5}
.umb{font-family:var(--display);font-weight:800;font-size:12px;padding:6px 10px;border-radius:999px;background:var(--mint);color:#063b34;white-space:nowrap}
.umb.carry{background:var(--gold);color:#4a3000}.umb.must{background:var(--rain);color:#fff}.umb.unknown{background:#e6dcf0;color:var(--ink)}

.logo{text-align:center;margin:2px 0 0}
.logo h1{margin:0;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.04em;line-height:1.05;color:#fff;
  -webkit-text-stroke:6px var(--pink);paint-order:stroke fill;text-shadow:0 4px 0 var(--pink-deep)}
.logo small{display:block;font-family:var(--serif);font-style:italic;font-weight:600;font-size:17px;letter-spacing:.12em;color:var(--pink-deep)}
.logo small::before,.logo small::after{content:"";display:inline-block;width:22px;height:1px;background:currentColor;vertical-align:middle;margin:0 8px}

.screen{display:flex;flex-direction:column;gap:12px}
.screen[hidden]{display:none!important}
.stage{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:24px;overflow:hidden;isolation:isolate;border:3px solid #fff;
  box-shadow:0 8px 0 rgba(91,140,255,.16);display:grid;place-items:center;background:#ffd6ec}
/* カード画面は背景の絵の上に、天気の色を薄く重ねるだけ */
#stage{background:#ffd6ec url(card-bg.jpg) center/cover no-repeat}
.sky{position:absolute;inset:0;z-index:0;transition:background .6s}
.sky.sunny{background:linear-gradient(180deg,rgba(255,214,130,.16),rgba(255,214,130,0) 60%)}
.sky.cloudy{background:linear-gradient(180deg,rgba(160,150,210,.14),rgba(160,150,210,0) 60%)}
.sky.rain{background:linear-gradient(180deg,rgba(110,140,230,.22),rgba(110,140,230,.04) 70%)}
.sky.snow{background:linear-gradient(180deg,rgba(210,225,255,.2),rgba(210,225,255,0) 60%)}

/* home stage（背景は1枚の絵。スクリーンの天気と照明は canvas で重ねる） */
.home{background:#2a1440 url(stage.jpg) center/cover no-repeat}
#homeFx{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;pointer-events:none}
.member{position:absolute;bottom:11%;left:50%;width:42%;aspect-ratio:3/4.4;transform:translateX(-50%);z-index:2;display:flex;align-items:flex-end;justify-content:center;cursor:pointer}
.member img{max-width:100%;max-height:100%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 6px 10px rgba(58,35,80,.18))}
.member .ghost{width:100%;height:100%;border-radius:90px 90px 12px 12px;border:2px dashed rgba(255,255,255,.8);display:grid;place-items:center;
  font-family:var(--display);font-weight:800;color:#fff;text-align:center;font-size:13px;line-height:1.6;background:rgba(255,255,255,.14);text-shadow:0 1px 4px rgba(0,0,0,.35)}
.nametag{position:absolute;top:12px;left:12px;z-index:3;font-family:var(--display);font-weight:800;font-size:12px;background:rgba(58,35,80,.85);color:#fff;padding:4px 10px;border-radius:999px}
.bubble{position:absolute;left:12px;right:12px;bottom:12px;z-index:4;background:rgba(255,255,255,.95);border-radius:16px;padding:10px 14px;font-size:13px;line-height:1.6;
  box-shadow:0 4px 0 rgba(216,40,127,.2)}
.bubble small{display:block;font-family:var(--display);font-weight:800;color:var(--pink);font-size:11px}
.hint{text-align:center;font-size:12px;color:var(--ink-soft);margin:0}

/* card stage */
.night{position:absolute;inset:0;z-index:1;opacity:0;pointer-events:none;background:radial-gradient(120% 75% at 50% 100%,rgba(130,70,180,.5) 0%,rgba(36,16,72,.8) 70%)}
.haze{position:absolute;z-index:2;left:-10%;right:-10%;bottom:-8%;height:38%;opacity:0;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(60% 60% at 50% 100%,var(--beam,#ff7ad9) 0%,transparent 70%);filter:blur(10px)}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.bloom{position:absolute;z-index:4;width:140%;aspect-ratio:1;border-radius:50%;opacity:0;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,255,255,.4) 25%,transparent 60%)}
.card-wrap{position:relative;z-index:6;width:62%;max-width:240px;aspect-ratio:5/7;perspective:1000px}
.card{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.back{background:linear-gradient(160deg,#2a1450,#120a24);display:grid;place-items:center;box-shadow:0 14px 30px rgba(20,10,38,.35)}
.back::before{content:"";position:absolute;inset:7px;border-radius:9px;border:1px solid rgba(255,200,90,.65)}
.back svg{width:46%;height:auto;position:relative}
.back .tag{position:absolute;bottom:14px;width:100%;text-align:center;font-family:var(--serif);font-style:italic;font-weight:600;font-size:13px;letter-spacing:.2em;color:rgba(255,200,90,.85)}
.edge{position:absolute;inset:-2px;border-radius:16px;z-index:-1;opacity:0;filter:blur(3px);
  background:conic-gradient(from var(--a,0deg),transparent 0deg,var(--edge,#ff7ad9) 40deg,transparent 90deg,transparent 180deg,var(--edge,#ff7ad9) 220deg,transparent 270deg)}
.front{transform:rotateY(180deg);background:#fff;display:flex;flex-direction:column;box-shadow:0 14px 30px rgba(20,10,38,.35)}
.front::after{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;border:4px solid var(--rim,#fff)}
.art{position:relative;flex:1;margin:4px 4px 0;border-radius:10px 10px 4px 4px;overflow:hidden;display:grid;place-items:center}
.art.sunny{background:linear-gradient(180deg,#ffd36b,#ff9ccc)}.art.cloudy{background:linear-gradient(180deg,#d8c6ff,#bcd3f2)}
.art.rain{background:linear-gradient(180deg,#7fa2ff,#b89cff)}.art.snow{background:linear-gradient(180deg,#e8f2ff,#c9bfff)}
.art img{width:100%;height:100%;object-fit:cover}
.sheen{position:absolute;inset:-20%;pointer-events:none;opacity:0;mix-blend-mode:overlay;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.9) 45%,rgba(160,255,240,.7) 50%,rgba(255,170,230,.7) 55%,transparent 65%)}
.rar{position:absolute;top:10px;left:0;z-index:2;font-family:var(--serif);font-style:italic;font-weight:600;font-size:20px;letter-spacing:.06em;
  color:#fff;padding:1px 14px 1px 10px;clip-path:inset(0 100% 0 0);background:var(--rarbg,#a99cbd)}
.newtag{position:absolute;top:10px;right:8px;z-index:2;font-family:var(--display);font-weight:800;font-size:11px;background:var(--pink);color:#fff;padding:2px 8px;border-radius:999px;opacity:0}
.stamp{padding:6px 10px 8px;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.stamp b{font-family:var(--display);font-weight:800;color:var(--ink);font-size:12px}
.speech{position:absolute;left:12px;right:12px;bottom:12px;z-index:7;opacity:0;background:rgba(255,255,255,.96);border-radius:14px;padding:9px 14px;line-height:1.6}
.speech small{display:block;font-family:var(--display);font-weight:800;color:var(--pink);font-size:11px}
.idle{position:absolute;z-index:5;bottom:9%;text-align:center;font-family:var(--display);font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(120,40,110,.7),0 0 12px rgba(150,60,140,.6);font-size:15px}

.btn{font-family:var(--display);font-weight:800;border:none;cursor:pointer;border-radius:18px;padding:12px 8px 14px;color:#fff;font-size:17px;line-height:1.2;width:100%;
  background:linear-gradient(180deg,#ff7cc0,var(--pink));box-shadow:0 6px 0 var(--pink-deep)}
.btn small{display:block;font-size:11px;font-weight:500;margin-bottom:2px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-deep)}
.btn:disabled{background:linear-gradient(180deg,#d9cfe6,#bfb2d1);box-shadow:0 6px 0 #9d8fb3;cursor:default}

/* book */
.panel{background:rgba(255,255,255,.88);border:2px solid #fff;border-radius:18px;padding:12px}
.book-h{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-weight:800}
.book-h span{font-family:var(--body);font-weight:400;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.group{margin-top:12px}
.group h3{margin:0 0 6px;font-family:var(--display);font-weight:800;font-size:13px;display:flex;gap:8px;align-items:baseline}
.group h3 small{font-weight:500;font-size:11px;color:var(--ink-soft)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{position:relative;aspect-ratio:5/7;border-radius:8px;overflow:hidden;border:none;padding:0;cursor:pointer;
  background:repeating-linear-gradient(45deg,#efe8f6 0 5px,#e6dcf0 5px 10px);display:grid;place-items:center;color:#a99cbd;font-family:var(--serif);font-style:italic;font-weight:600}
.slot img{width:100%;height:100%;object-fit:cover}
.slot .r{position:absolute;left:0;bottom:0;font-size:12px;color:#fff;background:rgba(58,35,80,.55);padding:0 6px;border-top-right-radius:6px}
.slot .n{position:absolute;right:3px;top:3px;font-family:var(--display);font-style:normal;font-size:10px;background:#fff;color:var(--ink);border-radius:999px;padding:0 5px}
.slot:disabled{cursor:default}
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,10,38,.6);display:grid;place-items:center;padding:24px 16px}
.modal-card{background:#fff;border-radius:20px;width:100%;max-width:360px;max-height:90%;overflow:auto;padding:12px}
.modal-card img{width:100%;border-radius:12px;display:block}
.modal-card h4{margin:10px 2px 4px;font-family:var(--display);font-weight:800}
.hist{list-style:none;margin:0;padding:0;font-size:12px}
.hist li{padding:6px 2px;border-top:1px solid var(--line);line-height:1.6}
.hist b{font-variant-numeric:tabular-nums;font-weight:700;margin-right:6px}

/* talk */
.talk{display:flex;flex-direction:column;gap:10px}
.say{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:start}
.say .who{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:11px;overflow:hidden}
.say .who{position:relative}
/* 基準の画像はプロフィール画面なので、顔のあたりだけを丸に入れる */
.say .who img{position:absolute;width:260%;max-width:none;left:-123%;top:-17%}
.say .txt{background:#fff;border-radius:4px 16px 16px 16px;padding:8px 12px;line-height:1.6}
.say .txt small{display:block;font-family:var(--display);font-weight:800;font-size:11px;color:var(--pink)}
.empty{text-align:center;color:var(--ink-soft);font-size:13px;line-height:1.8;padding:24px 8px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.95);border-top:2px solid #fff;box-shadow:0 -4px 16px rgba(58,35,80,.08);
  padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px)}
.tabs nav{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabs button{border:none;background:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-weight:800;font-size:11px;color:var(--ink-soft);cursor:pointer}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--pink)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:12px;max-width:90%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.member img,.member .ghost{animation:breathe 3.2s ease-in-out infinite}
</style>
</head>
<body>
<div class="app">
  <section class="wx" aria-label="今日の天気">
    <svg id="wxIcon" viewBox="0 0 40 40" aria-hidden="true"></svg>
    <div style="min-width:0"><b id="wxMain">読み込み中…</b><span id="wxSub">&nbsp;</span></div>
    <span class="umb unknown" id="umb">傘</span>
  </section>
  <div class="logo"><h1>UTAPURI</h1><small>Weather</small></div>

  <!-- home -->
  <section class="screen" id="s-home">
    <div class="stage home">
      <canvas id="homeFx" aria-hidden="true"></canvas>
      <span class="nametag" id="nametag">今日の担当</span>
      <div class="member" id="member" role="button" tabindex="0" aria-label="話しかける"></div>
      <div class="bubble" id="bubble"><small id="bubbleName"></small><span id="bubbleText"></span></div>
    </div>
    <p class="hint">メンバーをタップすると、話しかけられるよ</p>
  </section>

  <!-- card -->
  <section class="screen" id="s-card" hidden>
    <div class="stage" id="stage">
      <div class="sky sunny" id="cardSky"></div>
      <div class="night" id="night"></div>
      <div class="haze" id="haze"></div>
      <canvas id="fx" aria-hidden="true"></canvas>
      <div class="bloom" id="bloom"></div>
      <div class="card-wrap" id="cardWrap">
        <div class="edge" id="edge"></div>
        <div class="card" id="card">
          <div class="face back">
            <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3l2.6 13.2L36 20l-13.4 3.8L20 37l-2.6-13.2L4 20l13.4-3.8z" fill="none" stroke="#ffc85a" stroke-width="1.2"/><circle cx="20" cy="20" r="2.2" fill="#ffc85a"/></svg>
            <span class="tag">MORNING</span>
          </div>
          <div class="face front" id="front">
            <span class="rar" id="rar">N</span>
            <span class="newtag" id="newtag">NEW</span>
            <div class="art" id="art"><div class="sheen" id="sheen"></div></div>
            <div class="stamp"><b id="cardName"></b><span id="cardDate"></span></div>
          </div>
        </div>
      </div>
      <div class="idle" id="idle">タップで、今日のカードを</div>
      <div class="speech" id="speech"><small id="speaker"></small><span id="speechText"></span></div>
    </div>
    <button class="btn" id="pull" type="button"><small>1日1回 無料</small>カードを引く</button>
  </section>

  <!-- book -->
  <section class="screen" id="s-book" hidden>
    <div class="panel">
      <div class="book-h">図鑑 <span id="bookCount">0 / 0</span></div>
      <div id="book"></div>
    </div>
  </section>

  <!-- talk -->
  <section class="screen" id="s-talk" hidden>
    <div class="panel">
      <div class="book-h">楽屋トーク <span id="talkWho"></span></div>
      <div class="talk" id="talk" style="margin-top:10px"></div>
    </div>
  </section>
</div>

<div class="tabs"><nav>
  <button type="button" data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>ホーム</button>
  <button type="button" data-tab="card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M12 8l1.2 2.6 2.8.3-2.1 1.9.6 2.8L12 14.2 9.5 15.6l.6-2.8L8 10.9l2.8-.3z"/></svg>カード</button>
  <button type="button" data-tab="book"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>図鑑</button>
  <button type="button" data-tab="talk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/></svg>楽屋</button>
</nav></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
// ===== 設定（ここだけ書き換える） =====
const CONFIG = {
  apiBase: 'https://icy-squad-sputter.ngrok-free.dev', // PCの窓口
};
// 合言葉は LINE に届くリンクの ?k= に入っている（ブラウザで試す時も ?k=合言葉 をつけて開く）
const KEY = new URLSearchParams(location.search).get('k');

(function(){
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let T = null, imgCache = new Map();

  // ---- 通信（ngrokの警告ページを飛ばすヘッダーつき） ----
  async function api(path, opts = {}) {
    const res = await fetch(CONFIG.apiBase + path, {
      ...opts,
      headers: { 'ngrok-skip-browser-warning': '1', ...(KEY ? { 'X-Key': KEY } : {}), ...(opts.headers || {}) },
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `読み込めなかったよ（${res.status}）`);
    return body;
  }
  async function img(url) {
    if (!url) return null;
    if (imgCache.has(url)) return imgCache.get(url);
    const p = fetch(CONFIG.apiBase + url, { headers: { 'ngrok-skip-browser-warning': '1' } })
      .then(r => r.ok ? r.blob() : null).then(b => b ? URL.createObjectURL(b) : null).catch(() => null);
    imgCache.set(url, p);
    return p;
  }
  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
    setTimeout(() => t.remove(), 3200);
  }

  // ---- 天気 ----
  const ICONS = {
    sunny:'<circle cx="20" cy="20" r="8" fill="#ffc23d"/><g stroke="#ffc23d" stroke-width="3" stroke-linecap="round"><path d="M20 3v5M20 32v5M3 20h5M32 20h5M8 8l3.5 3.5M28.5 28.5L32 32M8 32l3.5-3.5M28.5 11.5L32 8"/></g>',
    cloudy:'<path d="M12 30h17a7 7 0 0 0 0-14 9 9 0 0 0-17 2 6 6 0 0 0 0 12z" fill="#b8a6d9"/>',
    rain:'<path d="M10 24h18a7 7 0 0 0 0-14 9 9 0 0 0-17 2 6 6 0 0 0-1 12z" fill="#5b8cff"/><g stroke="#5b8cff" stroke-width="2.5" stroke-linecap="round"><path d="M13 29l-2 5M20 29l-2 5M27 29l-2 5"/></g>',
    snow:'<path d="M10 24h18a7 7 0 0 0 0-14 9 9 0 0 0-17 2 6 6 0 0 0-1 12z" fill="#9db3e6"/><g fill="#9db3e6"><circle cx="13" cy="31" r="2"/><circle cx="20" cy="34" r="2"/><circle cx="27" cy="31" r="2"/></g>'
  };
  const UMB = { none:'傘いらない', carry:'折りたたみ傘', must:'傘必須', unknown:'傘' };
  function renderWeather(w) {
    $('wxIcon').innerHTML = ICONS[w.key] || ICONS.cloudy;
    $('wxMain').textContent = `北九州 ${w.description} ${w.temp != null ? Math.round(w.temp) + '℃' : ''}`;
    const parts = [];
    if (w.next) parts.push(`${w.next.window} 降水${w.next.popPct}%`);
    if (w.today && w.today.tempMin != null) parts.push(`18時まで ${w.today.tempMin}〜${w.today.tempMax}℃・最大${w.today.maxPopPct}%`);
    $('wxSub').textContent = parts.join(' ／ ') || ' ';
    const u = $('umb'); u.textContent = UMB[w.umbrella?.level] || '傘'; u.className = 'umb ' + (w.umbrella?.level || 'unknown');
    $('cardSky').className = 'sky ' + w.key;
  }

  // ---- ホームのステージ（スクリーンの天気・スポットライト・床の映り込み・光の粒） ----
  function homeStage(key) {
    if (!({ sunny: 1, cloudy: 1, rain: 1, snow: 1 })[key]) key = 'cloudy';
    const cv = $('homeFx'), ctx = cv.getContext('2d');
    const BEAM_COL = { sunny:['#ffd27a','#ff8fc8','#ffffff','#ffb45c'], cloudy:['#cdbdff','#ffffff','#ffc6e8','#bcd3f2'],
      rain:['#9ec0ff','#c9a8ff','#ffffff','#7fe0ff'], snow:['#ffffff','#bfe3ff','#ffd6f0','#ffffff'] }[key];
    const SCREEN_TINT = { sunny:'#ffc6a0', cloudy:'#cdbdff', rain:'#7f9cff', snow:'#e6ecff' }[key];
    const RIGS = [.26,.402,.597,.737]; // 背景の絵の照明の位置
    let W = 0, H = 0, t = 0, SC = null, motes = [];
    const rnd = (a,b) => a + Math.random()*(b-a);

    // 他のタブを開いている間は大きさが0になるので、見えている時だけ大きさを合わせる
    function size(){
      const r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio||1);
      if (!r.width) { W = 0; return; }
      W = r.width; H = r.height; cv.width = W*d; cv.height = H*d; ctx.setTransform(d,0,0,d,0,0);
      SC = null;
      motes = Array.from({length:36},()=>({x:Math.random()*W,y:Math.random()*H,s:1+Math.random()*2.5,v:.06+Math.random()*.16,ph:Math.random()*6}));
    }

    const scr = () => ({ x: W*.2007, y: H*.212, w: W*.5976, h: H*.2196, r: W*.022 }); // 背景の絵の黒いスクリーンの位置
    function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
    function sparkle4(x,y,r){ ctx.beginPath(); ctx.moveTo(x,y-r); ctx.quadraticCurveTo(x+r*.12,y-r*.12,x+r,y); ctx.quadraticCurveTo(x+r*.12,y+r*.12,x,y+r); ctx.quadraticCurveTo(x-r*.12,y+r*.12,x-r,y); ctx.quadraticCurveTo(x-r*.12,y-r*.12,x,y-r); ctx.fill(); }

    // ふわっとした雲のスプライト（明るい上側と、影の下側）
    function cloudSprite(w, h, top, bottom, puffs = 9){
      const c = document.createElement('canvas'), d = 2; c.width = w*d; c.height = h*d;
      const g = c.getContext('2d'); g.scale(d,d);
      const P = [];
      for(let i=0;i<puffs;i++){ const x = w*(.12 + .76*i/(puffs-1)) + rnd(-w*.04,w*.04); const r = h*(.22 + .28*Math.sin(Math.PI*i/(puffs-1))) * rnd(.85,1.15); P.push([x, h*.68 - r*.55, r]); }
      for(let i=0;i<5;i++) P.push([rnd(w*.3,w*.7), h*.38 + rnd(-h*.08,h*.06), h*rnd(.22,.32)]);
      // 同じ色の円を、ぼかした影つきで重ねる（輪郭の線が出ないように）
      g.fillStyle = top; g.shadowColor = top; g.shadowBlur = h*.12;
      g.beginPath(); for(const [x,y,r] of P){ g.moveTo(x + r*.82, y); g.arc(x, y, r*.82, 0, 7); } g.fill();
      g.shadowBlur = 0;
      // 上側のハイライト
      const hl = g.createLinearGradient(0, 0, 0, h*.6); hl.addColorStop(0, 'rgba(255,255,255,.55)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
      g.globalCompositeOperation = 'source-atop'; g.fillStyle = hl; g.fillRect(0, 0, w, h);
      const sh = g.createLinearGradient(0, h*.3, 0, h); sh.addColorStop(0,'rgba(0,0,0,0)'); sh.addColorStop(1, bottom);
      g.fillStyle = sh; g.fillRect(0,0,w,h);
      return c;
    }

    function skyline(s){
      const out = []; let x = s.x - 4;
      while(x < s.x + s.w){ const w = rnd(s.w*.05, s.w*.11); out.push({ x, w, h: rnd(s.h*.08, s.h*.24), tower: Math.random() < .12, win: Array.from({length: 8}, () => Math.random()) }); x += w + rnd(0, 3); }
      return out;
    }

    function initScreen(){
      const s = scr(), sp = (n, f) => Array.from({length:n}, f);
      SC = { s, city: skyline(s), clouds: [], streaks: [], splash: [], beads: [], slides: [], flakes: [], glints: [], flash: 0, nextFlash: 240 };
      const cw = s.w*.55, ch = s.h*.3;
      if(key === 'sunny'){
        SC.clouds = sp(3, () => ({ img: cloudSprite(cw*rnd(.7,1), ch*rnd(.7,.9), 'rgba(255,255,255,.95)', 'rgba(255,190,160,.35)'), x: rnd(0, s.w), y: s.h*rnd(.38,.6), v: rnd(.025,.06), a: rnd(.7,.95) }));
        SC.glints = sp(14, () => ({ x: rnd(0,1), y: rnd(.1,.7), ph: rnd(0,6) }));
      }
      if(key === 'cloudy'){
        const layers = [['rgba(205,198,232,.95)','rgba(120,110,170,.45)',.018,.55], ['rgba(232,226,248,.97)','rgba(140,130,190,.4)',.035,.75], ['rgba(255,255,255,.98)','rgba(150,140,200,.35)',.06,.95]];
        layers.forEach(([top,bot,v,a],L) => { for(let i=0;i<3;i++) SC.clouds.push({ img: cloudSprite(cw*rnd(.9,1.3)*(1+L*.15), ch*rnd(.9,1.2)*(1+L*.15), top, bot, 11), x: rnd(-cw, s.w), y: s.h*(.05 + L*.18 + rnd(0,.12)), v, a, L }); });
      }
      if(key === 'rain'){
        [['rgba(120,128,170,.95)','rgba(30,36,80,.6)',.03,.9],['rgba(150,158,200,.95)','rgba(40,46,96,.55)',.055,.95]].forEach(([top,bot,v,a],L) => { for(let i=0;i<3;i++) SC.clouds.push({ img: cloudSprite(cw*rnd(1.1,1.5), ch*rnd(1,1.3), top, bot, 12), x: rnd(-cw, s.w), y: s.h*(-.05 + L*.12 + rnd(0,.08)), v, a, L }); });
        SC.streaks = sp(55, () => ({ x: rnd(-.1,1.1), y: rnd(0,1), z: Math.random() }));
        SC.beads = sp(26, () => ({ x: rnd(.02,.98), y: rnd(.04,.96), r: rnd(1,2.6) }));
        SC.slides = sp(4, () => ({ x: rnd(.05,.95), y: rnd(-.3,.4), v: rnd(.0005,.0014), r: rnd(2.2,3.4), trail: [] }));
      }
      if(key === 'snow'){
        SC.clouds = sp(3, () => ({ img: cloudSprite(cw*1.2, ch, 'rgba(240,244,255,.9)', 'rgba(150,160,210,.35)', 11), x: rnd(-cw, s.w), y: s.h*rnd(-.05,.12), v: .02, a: .85 }));
        SC.flakes = sp(90, () => ({ x: rnd(0,1), y: rnd(0,1), z: Math.random(), ph: rnd(0,6) }));
      }
    }

    function drawCity(s, body, lit, roofSnow){
      const base = s.y + s.h;
      for(const b of SC.city){
        const top = base - b.h;
        ctx.fillStyle = body; ctx.fillRect(b.x, top, b.w, b.h);
        if(b.tower){ ctx.fillRect(b.x + b.w*.42, top - s.h*.08, b.w*.16, s.h*.08); ctx.fillStyle = '#ff6b8a'; ctx.beginPath(); ctx.arc(b.x + b.w*.5, top - s.h*.08, 1.6, 0, 7); ctx.globalAlpha = .5 + .5*Math.sin(t*.02); ctx.fill(); ctx.globalAlpha = 1; }
        if(lit){ for(let r=0;r<4;r++) for(let c=0;c<2;c++){ const k = b.win[(r*2+c)%8]; if(k < lit){ ctx.fillStyle = `rgba(255,224,150,${.6 + .25*Math.sin(t*.004 + k*20)})`; ctx.fillRect(b.x + b.w*(.22 + c*.38), top + b.h*(.15 + r*.2), b.w*.18, b.h*.08); } } }
        if(roofSnow){ ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.beginPath(); ctx.ellipse(b.x + b.w/2, top, b.w*.55, 2.4, 0, 0, 7); ctx.fill(); }
      }
    }

    function drawClouds(s, filter){
      for(const c of SC.clouds){ if(filter && !filter(c)) continue;
        c.x += c.v; if(c.x > s.w + 10) c.x = -c.img.width/2;
        ctx.globalAlpha = c.a; ctx.drawImage(c.img, s.x + c.x - c.img.width/4, s.y + c.y, c.img.width/2, c.img.height/2); }
      ctx.globalAlpha = 1;
    }

    function sunny(s){
      let g = ctx.createLinearGradient(0, s.y, 0, s.y + s.h);
      g.addColorStop(0, '#4f9cff'); g.addColorStop(.55, '#9fd2ff'); g.addColorStop(1, '#ffd2b0');
      ctx.fillStyle = g; ctx.fillRect(s.x, s.y, s.w, s.h);
      const cx = s.x + s.w*.74, cy = s.y + s.h*.26, R = s.h*.13;
      // 太陽の光の筋（ゆっくり回る、やわらかい）
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(t*.0007); ctx.globalCompositeOperation = 'lighter';
      for(let i=0;i<16;i++){ ctx.rotate(Math.PI/8); const len = s.w*(.55 + .08*Math.sin(t*.005 + i)); const rg = ctx.createLinearGradient(0,0,len,0); rg.addColorStop(0,'rgba(255,250,220,.35)'); rg.addColorStop(1,'rgba(255,250,220,0)'); ctx.fillStyle = rg; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(len, -len*.035); ctx.lineTo(len, len*.035); ctx.fill(); }
      ctx.restore();
      // 光のかさ
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      g = ctx.createRadialGradient(cx, cy, 0, cx, cy, s.h*.6); g.addColorStop(0, 'rgba(255,248,210,.75)'); g.addColorStop(.25, 'rgba(255,236,170,.3)'); g.addColorStop(1, 'rgba(255,236,170,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, s.h*.6, 0, 7); ctx.fill(); ctx.restore();
      g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R*(1 + .03*Math.sin(t*.012))); g.addColorStop(0, '#ffffff'); g.addColorStop(.7, '#fff7cf'); g.addColorStop(1, 'rgba(255,240,180,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R*1.1, 0, 7); ctx.fill();
      drawClouds(s);
      drawCity(s, 'rgba(120,80,160,.55)', .15, false);
      // レンズフレア
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const mx = s.x + s.w*.5, my = s.y + s.h*.55;
      [[.55,10,'255,190,230'],[.9,5,'170,230,255'],[1.25,16,'255,230,170'],[1.6,7,'200,170,255']].forEach(([k,r,c]) => { const x = cx + (mx - cx)*k*1.4, y = cy + (my - cy)*k*1.4; const fg = ctx.createRadialGradient(x,y,0,x,y,r); fg.addColorStop(0,`rgba(${c},.35)`); fg.addColorStop(.7,`rgba(${c},.18)`); fg.addColorStop(1,`rgba(${c},0)`); ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); });
      // きらめき
      ctx.fillStyle = '#fff';
      for(const k of SC.glints){ const a = Math.max(0, Math.sin(t*.008 + k.ph)); if(a < .3) continue; ctx.globalAlpha = a*.9; sparkle4(s.x + k.x*s.w, s.y + k.y*s.h, 2 + a*3); }
      ctx.restore(); ctx.globalAlpha = 1;
    }

    function cloudy(s){
      const g = ctx.createLinearGradient(0, s.y, 0, s.y + s.h);
      g.addColorStop(0, '#a9a3d6'); g.addColorStop(.6, '#d6cfee'); g.addColorStop(1, '#f1e6f4');
      ctx.fillStyle = g; ctx.fillRect(s.x, s.y, s.w, s.h);
      drawClouds(s, c => c.L === 0);
      // 雲の切れ間から差す光
      const k = Math.max(0, Math.sin(t*.0022));
      if(k > .02){ ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = k*.6;
        for(let i=0;i<3;i++){ const x0 = s.x + s.w*(.55 + i*.09), sg = ctx.createLinearGradient(x0, s.y, x0 - s.w*.25, s.y + s.h);
          sg.addColorStop(0,'rgba(255,248,225,.55)'); sg.addColorStop(1,'rgba(255,248,225,0)'); ctx.fillStyle = sg;
          ctx.beginPath(); ctx.moveTo(x0, s.y); ctx.lineTo(x0 + s.w*.04, s.y); ctx.lineTo(x0 - s.w*.18, s.y + s.h); ctx.lineTo(x0 - s.w*.3, s.y + s.h); ctx.fill(); }
        ctx.restore(); }
      drawClouds(s, c => c.L === 1);
      drawCity(s, 'rgba(110,96,160,.6)', .3, false);
      drawClouds(s, c => c.L === 2);
    }

    function drop(x, y, r){
      const g = ctx.createRadialGradient(x - r*.3, y - r*.3, 0, x, y, r);
      g.addColorStop(0, 'rgba(255,255,255,.85)'); g.addColorStop(.5, 'rgba(200,215,255,.35)'); g.addColorStop(1, 'rgba(120,140,220,.25)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    }
    function rain(s){
      const g = ctx.createLinearGradient(0, s.y, 0, s.y + s.h);
      g.addColorStop(0, '#2f3a6e'); g.addColorStop(.6, '#5a6aa8'); g.addColorStop(1, '#8c90c4');
      ctx.fillStyle = g; ctx.fillRect(s.x, s.y, s.w, s.h);
      // 遠くの雨のもや
      ctx.fillStyle = 'rgba(200,210,255,.08)'; ctx.fillRect(s.x, s.y + s.h*.45, s.w, s.h*.55);
      drawClouds(s, c => c.L === 0);
      drawCity(s, 'rgba(30,34,80,.75)', .55, false);
      drawClouds(s, c => c.L === 1);
      // 雨すじ（奥・中・手前）
      const wind = -.18;
      for(const r of SC.streaks){
        const sp = .005 + r.z*.008, len = 6 + r.z*14;
        r.y += sp; r.x += sp*wind*.6; if(r.y > 1.05){ r.y = -.05; r.x = rnd(-.1, 1.1);
          if(r.z > .7 && SC.splash.length < 12) SC.splash.push({ x: r.x, life: 1 }); }
        const x = s.x + r.x*s.w, y = s.y + r.y*s.h;
        ctx.strokeStyle = `rgba(220,232,255,${.25 + r.z*.5})`; ctx.lineWidth = .6 + r.z*1.1;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + wind*len, y + len); ctx.stroke();
      }
      // 地面のはね
      for(const p of SC.splash){ p.life -= .025; const x = s.x + p.x*s.w, y = s.y + s.h - 3;
        ctx.strokeStyle = `rgba(230,238,255,${p.life*.6})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(x, y, (1 - p.life)*7 + 1, (1 - p.life)*2 + .5, 0, 0, 7); ctx.stroke(); }
      SC.splash = SC.splash.filter(p => p.life > 0);
      // ときどき遠くで光る
      if(--SC.nextFlash <= 0){ SC.flash = 1; SC.nextFlash = Math.floor(rnd(1200, 2400)); }
      if(SC.flash > 0){ ctx.fillStyle = `rgba(230,236,255,${Math.sin(SC.flash*Math.PI)*.18})`; ctx.fillRect(s.x, s.y, s.w, s.h); SC.flash -= .02; }
      // スクリーンのガラスについた雨粒
      for(const b of SC.beads) drop(s.x + b.x*s.w, s.y + b.y*s.h, b.r);
      for(const d of SC.slides){
        d.y += d.v * (1 + .5*Math.sin(t*.015 + d.x*20)); d.trail.push(d.y); if(d.trail.length > 120) d.trail.shift();
        if(d.y > 1.05){ d.y = rnd(-.3, 0); d.x = rnd(.05,.95); d.trail = []; }
        ctx.strokeStyle = 'rgba(230,240,255,.22)'; ctx.lineWidth = d.r*.9; ctx.lineCap = 'round';
        if(d.trail.length > 1){ ctx.beginPath(); ctx.moveTo(s.x + d.x*s.w, s.y + d.trail[0]*s.h); ctx.lineTo(s.x + d.x*s.w, s.y + d.y*s.h); ctx.stroke(); }
        drop(s.x + d.x*s.w, s.y + d.y*s.h, d.r);
      }
    }

    function snow(s){
      const g = ctx.createLinearGradient(0, s.y, 0, s.y + s.h);
      g.addColorStop(0, '#8fa4dd'); g.addColorStop(.6, '#c9d4f4'); g.addColorStop(1, '#eef2ff');
      ctx.fillStyle = g; ctx.fillRect(s.x, s.y, s.w, s.h);
      drawClouds(s);
      drawCity(s, 'rgba(110,120,180,.55)', .4, true);
      ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(s.x, s.y + s.h - 3, s.w, 3);
      const wind = Math.sin(t*.0015)*.0006;
      for(const f of SC.flakes){
        const sp = .0005 + f.z*.0014;
        f.y += sp; f.x += wind*(.5 + f.z) + Math.sin(t*.007 + f.ph)*.0004*(1 + f.z);
        if(f.y > 1.03){ f.y = -.03; f.x = rnd(0,1); } if(f.x > 1.05) f.x = -.05; if(f.x < -.05) f.x = 1.05;
        const x = s.x + f.x*s.w, y = s.y + f.y*s.h, r = .8 + f.z*3.2;
        if(f.z > .82){ const bg = ctx.createRadialGradient(x,y,0,x,y,r*1.8); bg.addColorStop(0,'rgba(255,255,255,.75)'); bg.addColorStop(1,'rgba(255,255,255,0)'); ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(x,y,r*1.8,0,7); ctx.fill(); }
        else { ctx.fillStyle = `rgba(255,255,255,${.55 + f.z*.4})`; ctx.beginPath(); ctx.arc(x,y,r*.6,0,7); ctx.fill(); }
        if(f.z > .6 && Math.sin(t*.02 + f.ph*5) > .985){ ctx.fillStyle = '#fff'; sparkle4(x, y, r*1.6); }
      }
    }

    function screen(){
      const s = scr();
      if(!SC || SC.s.w !== s.w) initScreen();
      ctx.save(); roundRect(ctx, s.x, s.y, s.w, s.h, s.r); ctx.clip();
      ({ sunny, cloudy, rain, snow })[key](s);
      // 画面の質感（走査線とガラスの反射）
      ctx.fillStyle = 'rgba(255,255,255,.04)'; for(let y = s.y; y < s.y + s.h; y += 3) ctx.fillRect(s.x, y, s.w, 1);
      const gl = ctx.createLinearGradient(s.x, s.y, s.x + s.w*.6, s.y + s.h*.6);
      gl.addColorStop(0, 'rgba(255,255,255,.18)'); gl.addColorStop(.35, 'rgba(255,255,255,0)'); ctx.fillStyle = gl; ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.restore();
    }

    function reflection(){
      // スクリーンの色が床にうっすら映る
      const rg=ctx.createRadialGradient(W/2,H*.78,0,W/2,H*.78,W*.45);
      rg.addColorStop(0,rgba(SCREEN_TINT,.22)); rg.addColorStop(1,rgba(SCREEN_TINT,0));
      ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.translate(W/2,H*.78); ctx.scale(1,.45); ctx.translate(-W/2,-H*.78);
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(W/2,H*.78,W*.45,0,7); ctx.fill(); ctx.restore();
    }

    function beams(){
      ctx.save(); ctx.globalCompositeOperation='lighter';
      RIGS.forEach((rx,i)=>{
        const x0=W*rx, y0=H*.085, col=BEAM_COL[i];
        const ang=(i<2?1:-1)*(.22+.08*Math.sin(t*.0035+i*1.7)) + (i===1?-.18:i===2?.18:0);
        const breathe=.82+.18*Math.sin(t*.012+i*1.3);
        const L=H*1.1;
        for(let k=0;k<6;k++){
          const w=.09*(1-k*.14), a=(k===5?.09:.03)*breathe;
          const g=ctx.createLinearGradient(x0,y0,x0+Math.sin(ang)*L,y0+Math.cos(ang)*L);
          g.addColorStop(0,rgba(col,a*1.8)); g.addColorStop(.5,rgba(col,a)); g.addColorStop(1,rgba(col,0));
          ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(x0,y0);
          ctx.lineTo(x0+Math.sin(ang-w)*L,y0+Math.cos(ang-w)*L); ctx.lineTo(x0+Math.sin(ang+w)*L,y0+Math.cos(ang+w)*L); ctx.closePath(); ctx.fill();
        }
        // 床に落ちる光の輪
        const px=x0+Math.tan(ang)*(H*.86-y0), py=H*.86;
        ctx.save(); ctx.translate(px,py); ctx.scale(1,.3);
        const pg=ctx.createRadialGradient(0,0,0,0,0,W*.18); pg.addColorStop(0,rgba(col,.35*breathe)); pg.addColorStop(1,rgba(col,0));
        ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(0,0,W*.18,0,7); ctx.fill(); ctx.restore();
        // ライトの光源
        const lg=ctx.createRadialGradient(x0,y0,0,x0,y0,22); lg.addColorStop(0,`rgba(255,255,255,${.75+.2*breathe})`); lg.addColorStop(.3,rgba(col,.6*breathe)); lg.addColorStop(1,rgba(col,0));
        ctx.fillStyle=lg; ctx.beginPath(); ctx.arc(x0,y0,22,0,7); ctx.fill();
      });
      ctx.restore();
    }

    function particles(){
      ctx.save(); ctx.globalCompositeOperation='lighter';
      for(const m of motes){

    catch (e) { toast(e.message); busy = false; $('pull').disabled = false; return; }
    if (!r.pull) { toast(r.message || 'カードがまだないよ'); busy = false; $('pull').disabled = false; return; }
    if (r.already) { showPulled(r.pull); busy = false; return; }
    T.pulled = r.pull;
    const Rk = rarityKey(r.pull), big = Rk === 'SR' || Rk === 'LTD';
    await fillFront(r.pull, r.isNew);
    const done = () => { busy = false; $('pull').innerHTML = '<small>今日はもう引いたよ</small>また明日'; bookDirty = true; };

      .to('#edge',{opacity:0,duration:.6},'pop+=.2')
      .to('#night',{opacity:big?.8:.55,duration:1,ease:'power2.out'},'pop+=.2')
      .add(() => { gsap.killTweensOf(BEAMS); BEAMS.forEach((b,i) => { gsap.to(b,{o:big?.75:.35,a:b.base,duration:1.1,ease:'power2.out'}); if (big) gsap.to(b,{a:b.base+b.sw*.8,duration:2.4+i*.3,delay:1.1,yoyo:true,repeat:-1,ease:'sine.inOut'}); }); },'pop+=.2')
      .to('#haze',{opacity:big?.7:.3,duration:1},'pop+=.2')
      .fromTo('#sheen',{opacity:1,xPercent:-60},{xPercent:60,duration:1.1,ease:'power2.inOut'},'pop+=.45')
      .set('#sheen',{opacity:0})
      .to('#rar',{clipPath:'inset(0 0% 0 0)',duration:.45,ease:'power3.out'},'pop+=.6')
      .to('#newtag',{opacity:1,duration:.3},'pop+=.8')
      .to('#cardWrap',{y:-30,scale:1,duration:.7,ease:'power3.out'},'pop+=.9')
      .to('#speech',{opacity:1,y:0,duration:.6,ease:'power2.out'},'pop+=1.05');
  }
  $('pull').addEventListener('click', pull);
  $('stage').addEventListener('click', () => { if (!$('pull').disabled) pull(); });

  // ---- タブ ----
  let bookDirty = true, fxStarted = false;
  function show(tab) {
    document.querySelectorAll('.tabs button').forEach(b => b.dataset.tab === tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
    document.querySelectorAll('.screen').forEach(s => s.hidden = s.id !== 's-' + tab);
    if (tab === 'card' && !fxStarted) { fxStarted = true; size(); if (!reduce) { loop(); gsap.to('#cardWrap',{y:-8,duration:1.8,yoyo:true,repeat:-1,ease:'sine.inOut'}); } }
    if (tab === 'book' && bookDirty) { bookDirty = false; renderBook().catch(e => toast(e.message)); }
  }
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => show(b.dataset.tab)));

  // ---- 起動 ----
  async function start() {
    T = await api('/api/today');
    renderWeather(T.weather); homeStage(T.weather.key);
    await renderHome(); renderTalk();
    if (T.pulled) showPulled(T.pulled);
    if (location.hash === '#card') show('card');
  }
  start().catch(e => { $('wxMain').textContent = '読み込めなかったよ'; $('wxSub').textContent = e.message; });
})();
</script>
</body>
</html>
